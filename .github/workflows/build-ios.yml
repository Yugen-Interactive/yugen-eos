name: build-ios
on:
  push:
  pull_request:
  workflow_dispatch:
jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install SCons
        run: pip install scons
      - name: Clone godot-cpp
        run: git clone --branch godot-4.3-stable --depth 1 https://github.com/godotengine/godot-cpp.git godot-cpp
      - name: Resolve EOS SDK
        env:
          EOS_SDK_IOS_URL: ${{ secrets.EOS_SDK_IOS_URL }}
          EOS_SDK_TOKEN: ${{ secrets.EOS_SDK_TOKEN }}
        run: |
          if [ -n "$EOS_SDK_IOS_URL" ]; then
            mkdir -p third_party/eos_sdk
            curl -sSL -H "Authorization: Bearer $EOS_SDK_TOKEN" -o sdk-ios.zip "$EOS_SDK_IOS_URL"
            unzip -q sdk-ios.zip -d third_party/eos_sdk
          else
            echo "No iOS EOS SDK provided, stub build."
          fi
      - name: Build arm64 release
        run: scons platform=ios arch=arm64 target=template_release
      - uses: actions/upload-artifact@v4
        with:
          name: yugen-eos-ios
          path: bin/
