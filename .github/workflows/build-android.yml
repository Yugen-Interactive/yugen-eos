name: build-android
on:
  push:
  pull_request:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Install toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y scons unzip
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses > /dev/null
          "$SDKMANAGER" "ndk;23.2.8568313"
          ls "$ANDROID_HOME/ndk/23.2.8568313/toolchains/llvm/prebuilt/linux-x86_64" > /dev/null
      - name: Clone godot-cpp
        run: git clone --branch godot-4.3-stable --depth 1 https://github.com/godotengine/godot-cpp.git godot-cpp
      - name: Resolve EOS SDK
        env:
          EOS_SDK_ANDROID_URL: ${{ secrets.EOS_SDK_ANDROID_URL }}
          EOS_SDK_TOKEN: ${{ secrets.EOS_SDK_TOKEN }}
        run: |
          if [ -n "$EOS_SDK_ANDROID_URL" ]; then
            mkdir -p third_party/eos_sdk
            curl -sSL -H "Authorization: Bearer $EOS_SDK_TOKEN" -o sdk-android.zip "$EOS_SDK_ANDROID_URL"
            unzip -q sdk-android.zip -d third_party/eos_sdk
          else
            echo "No Android EOS SDK provided, stub build."
          fi
      - name: Build arm64 release
        run: scons platform=android arch=arm64 target=template_release
      - name: Build arm32 release
        run: scons platform=android arch=arm32 target=template_release
      - name: Verify artifacts
        run: |
          test -f bin/yugen_eos.android.arm64.so
          test -f bin/yugen_eos.android.arm32.so
          ls bin/
      - uses: actions/upload-artifact@v4
        with:
          name: yugen-eos-android
          path: bin/
